name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Attest and publish
    needs: full-ci
    permissions:
      contents: write # Create the release and upload its assets.
      id-token: write # Obtain the OIDC identity for provenance.
      attestations: write # Store build provenance for each asset.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Set up exact uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.2"
          enable-cache: false

      - name: Verify tag, lock, tests, and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          uv lock --check
          python -m unittest discover -s tests -v
          python -m py_compile tools/routerctl.py tests/test_routerctl.py scripts/build-release.py
          bash -n install-linux.sh

      - name: Build and verify provenance-checked assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-release.py
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "dist/*"

      - name: Publish or reconcile GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A manually published outage-recovery RC is reconciled with the
            # deterministic CI build and receives provenance attestations.
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            release_flags=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then release_flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              "${release_flags[@]}"
          fi
